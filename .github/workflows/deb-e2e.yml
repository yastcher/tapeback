name: deb-e2e

# End-to-end test for the Debian/Ubuntu packaging path: build the .deb on
# every PR that touches packaging-relevant files, then `apt install` it in a
# matrix of containers and verify the wrapper + bundled Python actually run.
# Catches regressions in build-deb.sh, nfpm configs, or src/ changes that
# break the bundled venv before they reach a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/build-deb.sh"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/deb-e2e.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.39.0
          curl -sSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build wheel
        run: uv build

      - name: Build .deb packages
        run: ./scripts/build-deb.sh dist/tapeback-*.whl

      - name: Inspect built .deb
        run: |
          echo "=== file sizes ==="
          ls -lh dist/*.deb
          echo ""
          echo "=== /usr/bin/tapeback wrapper ==="
          dpkg-deb -c dist/tapeback_*.deb | grep "usr/bin/tapeback"
          echo ""
          echo "=== venv/bin entries ==="
          dpkg-deb -c dist/tapeback_*.deb | grep "venv/bin/" | head -15
          echo ""
          echo "=== shebang of venv/bin/tapeback (extracted) ==="
          mkdir -p /tmp/inspect
          dpkg-deb -x dist/tapeback_*.deb /tmp/inspect
          head -1 /tmp/inspect/opt/tapeback/venv/bin/tapeback
          echo ""
          echo "=== venv python symlinks (extracted) ==="
          ls -la /tmp/inspect/opt/tapeback/venv/bin/python /tmp/inspect/opt/tapeback/venv/bin/python3 /tmp/inspect/opt/tapeback/venv/bin/python3.13
          echo ""
          echo "=== resolve symlink chain ==="
          readlink -f /tmp/inspect/opt/tapeback/venv/bin/python
          ls -la /tmp/inspect/opt/tapeback/python/bin/python3.13

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tapeback-debs
          path: dist/*.deb
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:26.10
          - ubuntu:26.04
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:13
          - debian:12
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tapeback-debs
          path: dist

      - name: List .debs
        run: ls -la dist/

      - name: Smoke test on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" "${{ matrix.image }}" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq /dist/tapeback_*.deb
              echo "=== /usr/bin/tapeback ==="
              ls -la /usr/bin/tapeback
              cat /usr/bin/tapeback
              echo ""
              echo "=== /opt/tapeback/venv/bin/tapeback ==="
              ls -la /opt/tapeback/venv/bin/tapeback || echo "MISSING"
              head -1 /opt/tapeback/venv/bin/tapeback 2>&1 || true
              echo ""
              echo "=== venv python symlinks ==="
              ls -la /opt/tapeback/venv/bin/python /opt/tapeback/venv/bin/python3 /opt/tapeback/venv/bin/python3.13 2>&1 || true
              echo ""
              echo "=== bundled python binary ==="
              ls -la /opt/tapeback/python/bin/python3.13 2>&1 || true
              /opt/tapeback/python/bin/python3.13 --version 2>&1 || true
              echo ""
              echo "=== running tapeback --version ==="
              tapeback --version
              echo "=== running tapeback status ==="
              tapeback status
          '
